name: Something went wrong
description: meme did something it should not have, or did not do what it should.
labels: [bug]
body:
  - type: textarea
    id: ran
    attributes:
      label: What you ran
      description: The command, and where (WSL, Windows, macOS, Linux; in a terminal or inside an agent).
      placeholder: meme continue 2, in Claude Code, in WSL
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: happened
    attributes:
      label: What happened instead
      description: What meme printed, or what the agent did with it. Leave out anything from your sessions you do not want to share.
    validations:
      required: true
  - type: textarea
    id: report
    attributes:
      label: meme report
      description: Run `meme report` (add `--session <id>` if one session is the problem) and paste what it prints. It holds no conversation content, and masks your home folder, user name and project paths.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checked
    attributes:
      label: Before you post
      options:
        - label: I read the report and it holds nothing I do not want to make public.
          required: true
